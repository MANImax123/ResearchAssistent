[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchflow-backend"
version = "0.1.0"
description = "ResearchFlow - Multi-Agent AI Research Paper Assistant (Backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "redis>=5.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "neo4j>=5.20.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "google-genai==2.28.0",
    "langchain>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # LangGraph's Postgres checkpointer uses psycopg; [binary] bundles libpq (absent from python:slim)
    "psycopg[binary]==3.3.6",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
    "citeproc-py>=0.6.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) would otherwise make ruff treat the library as first-party
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# autogenerated migrations contain long enum CHECK expressions
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# python-jose ships no type information
module = ["jose", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no type information; its task decorator is untyped
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.tasks", "app.workers.celery_app"]
disallow_untyped_decorators = false
